name: Sync DEV CRM Field Layouts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'adamlem-debug/vitalage-crm'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vitalage-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify DEV connection configuration
        env:
          DEV_FRAPPE_URL: ${{ secrets.DEV_FRAPPE_URL }}
          DEV_FRAPPE_API_KEY: ${{ secrets.DEV_FRAPPE_API_KEY }}
          DEV_FRAPPE_API_SECRET: ${{ secrets.DEV_FRAPPE_API_SECRET }}
        run: |
          test -n "$DEV_FRAPPE_URL" || { echo "Missing DEV_FRAPPE_URL"; exit 1; }
          test -n "$DEV_FRAPPE_API_KEY" || { echo "Missing DEV_FRAPPE_API_KEY"; exit 1; }
          test -n "$DEV_FRAPPE_API_SECRET" || { echo "Missing DEV_FRAPPE_API_SECRET"; exit 1; }
      - name: Export current layouts from DEV (read only)
        env:
          DEV_FRAPPE_URL: ${{ secrets.DEV_FRAPPE_URL }}
          DEV_FRAPPE_API_KEY: ${{ secrets.DEV_FRAPPE_API_KEY }}
          DEV_FRAPPE_API_SECRET: ${{ secrets.DEV_FRAPPE_API_SECRET }}
        run: python scripts/sync_dev_crm_layouts.py
      - name: Open reviewable layout synchronization PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: vitalage-dev
          branch: automation/sync-dev-crm-layouts
          delete-branch: true
          commit-message: "chore: sync CRM field layouts from DEV"
          title: "chore: sync CRM field layouts from DEV"
          body: |
            Read-only export of CRM Fields Layout from VitalAge DEV.
            Review before merging. Deployment to PROD requires the normal DEV smoke test and production PR.
          add-paths: crm/fcrm/vitalage_config_payload.json
